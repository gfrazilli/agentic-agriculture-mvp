[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-agriculture-mvp"
version = "0.1.0"
description = "Agentic Agriculture contracts and Google Cloud-ready Django API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "google-cloud-firestore>=2.20,<3",
    "google-cloud-storage>=3,<4",
    "google-cloud-tasks>=2.18,<3",
    "gunicorn>=23,<24; platform_system != 'Windows'",
    "pydantic>=2.10,<3",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.8,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["agriculture*", "config*", "core*"]

[tool.setuptools.package-data]
agriculture = ["fixtures/**/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
