<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">1415 Agri closing card</title>
  <desc id="desc">Closing message and canonical company logo.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f7f2"/>
      <stop offset="1" stop-color="#fbfdfb"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wash)"/>
  <circle cx="280" cy="160" r="380" fill="#e7f3e9" opacity="0.8"/>
  <circle cx="1710" cy="980" r="420" fill="#edf6ef" opacity="0.9"/>
