<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Authorized Taquarituba field context</title>
  <desc id="desc">Editorial context card for the authorized family field used in the demonstration, without coordinates.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#edf6ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#173d30" flood-opacity="0.11"/>
    </filter>
    <style>
      .eyebrow{font:700 20px Arial,Helvetica,sans-serif;letter-spacing:2.2px;fill:#2d7c54}
      .headline{font:700 64px Arial,Helvetica,sans-serif;fill:#0b3d2f}
      .sub{font:400 28px Arial,Helvetica,sans-serif;fill:#53675e}
      .label{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:1.6px;fill:#63766d}
      .value{font:700 34px Arial,Helvetica,sans-serif;fill:#133f31}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#wash)"/>
  <circle cx="1760" cy="150" r="330" fill="#dfeee3" opacity="0.72"/>
  <circle cx="170" cy="1010" r="360" fill="#e7f2e9" opacity="0.85"/>
  <text x="150" y="155" class="eyebrow">AUTHORIZED DEMONSTRATION FIELD</text>
  <text x="150" y="250" class="headline">Taquarituba Family Field</text>
  <text x="150" y="305" class="sub">A family-authorized area. Exact coordinates are intentionally withheld.</text>

  <g filter="url(#shadow)">
    <rect x="150" y="420" width="500" height="230" rx="30" fill="#ffffff" stroke="#bdd6c5" stroke-width="3"/>
    <rect x="710" y="420" width="500" height="230" rx="30" fill="#ffffff" stroke="#bdd6c5" stroke-width="3"/>
    <rect x="1270" y="420" width="500" height="230" rx="30" fill="#ffffff" stroke="#bdd6c5" stroke-width="3"/>
  </g>
  <text x="200" y="485" class="label">CROP</text>
  <text x="200" y="555" class="value">Soybeans</text>
  <text x="760" y="485" class="label">AUTHORIZED AREA</text>
  <text x="760" y="555" class="value">36 hectares</text>
  <text x="1320" y="485" class="label">MONITORING SEASON</text>
  <text x="1320" y="555" class="value">15 Oct 2025 — 15 Mar 2026</text>

  <rect x="150" y="745" width="1620" height="115" rx="28" fill="#e8f4eb" stroke="#b4d2bf" stroke-width="2"/>
  <circle cx="215" cy="802" r="17" fill="#2c8b5b"/>
  <text x="260" y="794" class="label">HUMAN CONTROL</text>
  <text x="260" y="829" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#36574a">Guided demonstration is off. The farmer reviews and confirms the boundary.</text>
</svg>
