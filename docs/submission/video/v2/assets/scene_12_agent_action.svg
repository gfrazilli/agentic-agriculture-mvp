<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#082f25"/>
  <circle cx="1650" cy="170" r="270" fill="#104b39"/>
  <circle cx="1730" cy="940" r="360" fill="#0b3b2e"/>
  <text x="112" y="118" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#a8ed62">THE ANSWER BECOMES AN ACTION</text>
  <text x="112" y="240" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#ffffff">“Compare this field again using three areas.”</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="112" y="390" width="430" height="240" rx="34" fill="#ffffff"/>
    <text x="327" y="477" font-size="24" font-weight="700" letter-spacing="3" fill="#4f695e">01 · INTENT</text>
    <text x="327" y="550" font-size="38" font-weight="700" fill="#0b4b38">Gemini plans</text>
    <text x="327" y="594" font-size="23" fill="#60776d">the next comparison</text>
    <text x="590" y="526" font-size="54" fill="#a8ed62">→</text>
    <rect x="650" y="390" width="520" height="240" rx="34" fill="#ffffff"/>
    <text x="910" y="477" font-size="24" font-weight="700" letter-spacing="3" fill="#4f695e">02 · MCP TOOL CALL</text>
    <text x="910" y="550" font-size="34" font-weight="700" fill="#0b4b38">request_field_analysis</text>
    <text x="910" y="594" font-size="23" fill="#60776d">typed, authorized, traceable</text>
    <text x="1218" y="526" font-size="54" fill="#a8ed62">→</text>
    <rect x="1280" y="390" width="520" height="240" rx="34" fill="#a8ed62"/>
    <text x="1540" y="477" font-size="24" font-weight="700" letter-spacing="3" fill="#244014">03 · STATE CHANGE</text>
    <text x="1540" y="550" font-size="38" font-weight="700" fill="#16330c">Analysis queued</text>
    <text x="1540" y="594" font-size="23" fill="#31521f">Cloud Tasks → private worker</text>
  </g>
  <rect x="112" y="760" width="1688" height="132" rx="26" fill="#104b39" stroke="#3e765f" stroke-width="2"/>
  <text x="170" y="824" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">IDEMPOTENT BY DESIGN</text>
  <text x="170" y="862" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c7ddd3">The same authorized request can be retried without creating duplicate work.</text>
  <text x="1660" y="842" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#a8ed62">ONE REQUEST · ONE JOB</text>
</svg>
