<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scene 5 — two-click field mapping</title>
  <desc id="desc">A three-step comparison replaces walking a GPS perimeter with a proposed and farmer-confirmed boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcf9"/><stop offset="1" stop-color="#eef4ef"/></linearGradient>
    <pattern id="map-grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0v70" fill="none" stroke="#d7e2d9" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123a2b" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a99e"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="108" fill="#23764f" font-size="20" font-weight="700" letter-spacing="3">FIELD MAPPING, REIMAGINED</text>
    <text x="110" y="190" fill="#0b3d2f" font-size="61" font-weight="700" letter-spacing="-1.5">FROM A GPS WALK TO TWO CLICKS.</text>
  </g>

  <g id="legacy-gps" transform="translate(110 285)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="500" height="610" rx="34" fill="#fff" stroke="#dce6df" stroke-width="2"/>
    <text x="34" y="55" fill="#7b8e84" font-size="18" font-weight="700" letter-spacing="2">BEFORE</text>
    <rect x="34" y="90" width="432" height="360" rx="22" fill="#eef3ed"/>
    <rect x="34" y="90" width="432" height="360" rx="22" fill="url(#map-grid)"/>
    <path d="M137 368 102 243 162 141 318 131 391 229 358 375 219 411Z" fill="none" stroke="#1d6b4a" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 13"/>
    <g fill="#fff" stroke="#1d6b4a" stroke-width="5">
      <circle cx="137" cy="368" r="10"/><circle cx="102" cy="243" r="10"/><circle cx="162" cy="141" r="10"/><circle cx="318" cy="131" r="10"/><circle cx="391" cy="229" r="10"/><circle cx="358" cy="375" r="10"/><circle cx="219" cy="411" r="10"/>
    </g>
    <circle cx="89" cy="383" r="22" fill="#f9ab00"/><path d="M89 371v24M77 383h24" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="34" y="510" fill="#0b3d2f" font-size="29" font-weight="700">Walk every GPS point.</text>
    <text x="34" y="553" fill="#5d7368" font-size="20">Export. Clean. Rebuild.</text>
  </g>

  <path d="M642 590H738" stroke="#94a99e" stroke-width="4" marker-end="url(#arrow)"/>

  <g id="reference-point" transform="translate(760 285)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="430" height="610" rx="34" fill="#fff" stroke="#dce6df" stroke-width="2"/>
    <text x="34" y="55" fill="#23764f" font-size="18" font-weight="700" letter-spacing="2">CLICK 1</text>
    <rect x="34" y="90" width="362" height="360" rx="22" fill="#e9f1e6"/>
    <rect x="34" y="90" width="362" height="360" rx="22" fill="url(#map-grid)"/>
    <path d="M95 380 81 241 147 140 304 129 356 242 319 393 174 419Z" fill="#bdd8b2" stroke="#8aaa81" stroke-width="3"/>
    <path d="M217 189c-46 0-83 37-83 83 0 62 83 130 83 130s83-68 83-130c0-46-37-83-83-83Z" fill="#176b49"/>
    <circle cx="217" cy="272" r="28" fill="#fff"/>
    <text x="34" y="510" fill="#0b3d2f" font-size="29" font-weight="700">Place one reference point.</text>
    <text x="34" y="553" fill="#5d7368" font-size="20">The field service proposes a boundary.</text>
    <rect x="34" y="575" width="210" height="46" rx="23" fill="#e7f3e9"/>
    <text x="139" y="606" text-anchor="middle" fill="#176b49" font-size="16" font-weight="700" letter-spacing="1">1 REFERENCE POINT</text>
  </g>

  <path d="M1222 590H1318" stroke="#94a99e" stroke-width="4" marker-end="url(#arrow)"/>

  <g id="confirmed-boundary" transform="translate(1340 285)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="470" height="610" rx="34" fill="#fff" stroke="#b9d4c1" stroke-width="3"/>
    <text x="34" y="55" fill="#23764f" font-size="18" font-weight="700" letter-spacing="2">CLICK 2</text>
    <rect x="34" y="90" width="402" height="360" rx="22" fill="#e9f1e6"/>
    <rect x="34" y="90" width="402" height="360" rx="22" fill="url(#map-grid)"/>
    <path d="M103 379 91 243 157 139 325 131 386 240 347 394 181 418Z" fill="#8bc177" fill-opacity=".72" stroke="#0f6545" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#fff" stroke="#0f6545" stroke-width="4"><circle cx="103" cy="379" r="8"/><circle cx="91" cy="243" r="8"/><circle cx="157" cy="139" r="8"/><circle cx="325" cy="131" r="8"/><circle cx="386" cy="240" r="8"/><circle cx="347" cy="394" r="8"/><circle cx="181" cy="418" r="8"/></g>
    <circle cx="366" cy="121" r="43" fill="#0f6545" stroke="#fff" stroke-width="8"/>
    <path d="m347 121 13 13 25-29" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="510" fill="#0b3d2f" font-size="29" font-weight="700">Review. Adjust. Confirm.</text>
    <text x="34" y="553" fill="#5d7368" font-size="20">The farmer stays in control.</text>
    <rect x="34" y="575" width="218" height="46" rx="23" fill="#0f6545"/>
    <text x="143" y="606" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" letter-spacing="1">FARMER CONFIRMED</text>
  </g>
  <g id="mapping-labels" font-family="Arial, Helvetica, sans-serif">
    <rect x="1470" y="930" width="340" height="58" rx="29" fill="#e7f3e9"/>
    <text x="1640" y="968" text-anchor="middle" fill="#176b49" font-size="18" font-weight="700" letter-spacing="1.5">1 PROPOSED BOUNDARY</text>
  </g>
</svg>
