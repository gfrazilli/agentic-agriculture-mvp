<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scene 2 — a signal before the symptom</title>
  <desc id="desc">An original timeline summarizes a 2024 multispectral UAV soybean study without reproducing the paper figure.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcf8"/><stop offset="1" stop-color="#f1f5ef"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#82bd42"/><stop offset="1" stop-color="#236846"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102b21" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="110" fill="#236846" font-size="20" font-weight="700" letter-spacing="3">A SIGNAL BEFORE THE SYMPTOM</text>
    <text x="110" y="190" fill="#0b3d2f" font-size="54" font-weight="700" letter-spacing="-1.4">The spectrum changed before the plant looked different.</text>
  </g>

  <g id="day-46-card" filter="url(#shadow)">
    <rect x="110" y="270" width="690" height="590" rx="34" fill="#ffffff" stroke="#dfe8df" stroke-width="2"/>
    <g id="healthy-canopy" transform="translate(240 355)">
      <path d="M190 326V118" stroke="#2c714b" stroke-width="14" stroke-linecap="round"/>
      <path d="M190 178C113 176 65 132 50 63c73-9 134 26 140 115Z" fill="url(#leaf)"/>
      <path d="M190 140c76-2 130-41 151-108-74-16-137 19-151 108Z" fill="url(#leaf)"/>
      <path d="M190 247C120 245 80 213 65 157c65-8 115 22 125 90Z" fill="#5b9e3e"/>
      <path d="M190 223c68-2 111-33 128-90-63-9-114 22-128 90Z" fill="#66a845"/>
      <path d="M35 337H350" stroke="#d5e2d2" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="red-edge-curve" transform="translate(470 430)" font-family="Arial, Helvetica, sans-serif">
      <path d="M0 232H245M0 232V20" stroke="#a8b7ae" stroke-width="2"/>
      <path d="M8 205c40-1 65-6 92-20 36-19 48-57 73-94 20-30 39-38 66-44" fill="none" stroke="#d34f73" stroke-width="8" stroke-linecap="round"/>
      <path d="M8 214c39-2 68-8 93-24 31-20 43-52 67-86 21-31 43-43 71-51" fill="none" stroke="#7d2f75" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 11"/>
      <text x="118" y="280" text-anchor="middle" fill="#5d6f64" font-size="18" font-weight="700">RED-EDGE RESPONSE</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="160" y="755" fill="#0b3d2f" font-size="38" font-weight="700">DAY 46</text>
      <text x="160" y="807" fill="#456258" font-size="22" font-weight="700" letter-spacing="1.2">RED-EDGE DIFFERENCE · NO VISIBLE WILTING</text>
    </g>
  </g>

  <g id="plus-18-days" font-family="Arial, Helvetica, sans-serif">
    <path d="M835 565H1055" stroke="#b8c8bd" stroke-width="4"/>
    <path d="m1044 548 22 17-22 17" fill="none" stroke="#b8c8bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="850" y="492" width="190" height="74" rx="37" fill="#0b3d2f"/>
    <text x="945" y="540" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700" letter-spacing="1">+18 DAYS</text>
  </g>

  <g id="day-64-card" filter="url(#shadow)">
    <rect x="1100" y="270" width="710" height="590" rx="34" fill="#ffffff" stroke="#dfe8df" stroke-width="2"/>
    <g id="wilted-canopy" transform="translate(1290 356)">
      <path d="M170 326V116" stroke="#786a3d" stroke-width="14" stroke-linecap="round"/>
      <path d="M170 170C98 191 58 175 20 120c62-32 123-15 150 50Z" fill="#9d9b49"/>
      <path d="M170 150c75 18 122 4 163-47-61-35-123-19-163 47Z" fill="#8a9244"/>
      <path d="M170 245c-63 16-103 3-135-42 53-29 104-14 135 42Z" fill="#afa554"/>
      <path d="M170 224c61 16 103 5 137-38-51-30-103-16-137 38Z" fill="#999344"/>
      <path d="M15 337H330" stroke="#e0dcc5" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="1575" y="397" width="150" height="150" rx="75" fill="#f2efe1"/>
      <path d="M1650 425c-37 51-47 74-47 92a47 47 0 0 0 94 0c0-18-10-41-47-92Z" fill="#b7a557"/>
      <text x="1150" y="755" fill="#0b3d2f" font-size="38" font-weight="700">DAY 64</text>
      <text x="1150" y="807" fill="#456258" font-size="22" font-weight="700" letter-spacing="1.2">VISIBLE WILTING</text>
    </g>
  </g>

  <g id="citation" font-family="Arial, Helvetica, sans-serif">
    <line x1="110" y1="925" x2="1810" y2="925" stroke="#d7e1d8" stroke-width="2"/>
    <text x="110" y="977" fill="#42584f" font-size="20">Jones et al. · The Plant Phenome Journal 7 (2024), e70009</text>
    <text x="1810" y="977" text-anchor="end" fill="#42584f" font-size="20">Multispectral UAV soybean study · DOI 10.1002/ppj2.70009</text>
  </g>
</svg>
