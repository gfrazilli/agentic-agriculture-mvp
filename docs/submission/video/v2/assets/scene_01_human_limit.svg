<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scene 1 — the human limit</title>
  <desc id="desc">An original aerial-style field composition transitions from visible color to false-color infrared.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ba47c"/>
      <stop offset="1" stop-color="#405e49"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061d16" stop-opacity=".88"/>
      <stop offset=".52" stop-color="#061d16" stop-opacity=".34"/>
      <stop offset="1" stop-color="#061d16" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="rows-a" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0V26" stroke="#d4dfbf" stroke-opacity=".24" stroke-width="5"/>
    </pattern>
    <pattern id="rows-b" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-31)">
      <path d="M0 0V24" stroke="#e6d4a5" stroke-opacity=".20" stroke-width="4"/>
    </pattern>
    <pattern id="ir-rows" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-31)">
      <path d="M0 0V22" stroke="#ffe16a" stroke-opacity=".20" stroke-width="4"/>
    </pattern>
    <clipPath id="infrared-reveal-mask"><rect id="infrared-wipe" x="1105" y="0" width="815" height="1080"/></clipPath>
  </defs>

  <g id="visible-field-layer">
    <rect width="1920" height="1080" fill="url(#sky)"/>
    <path d="M-70 70 555-80 750 315 82 480Z" fill="#8ca44f"/>
    <path d="M-70 70 555-80 750 315 82 480Z" fill="url(#rows-a)"/>
    <path d="M555-80 1265-30 1110 410 750 315Z" fill="#607b35"/>
    <path d="M555-80 1265-30 1110 410 750 315Z" fill="url(#rows-b)"/>
    <path d="M1265-30 2000 115 1790 478 1110 410Z" fill="#a08c55"/>
    <path d="M1265-30 2000 115 1790 478 1110 410Z" fill="url(#rows-a)"/>
    <path d="M82 480 750 315 890 1110-80 1110Z" fill="#466c43"/>
    <path d="M82 480 750 315 890 1110-80 1110Z" fill="url(#rows-b)"/>
    <path d="M750 315 1110 410 1422 1095 890 1110Z" fill="#7a9248"/>
    <path d="M750 315 1110 410 1422 1095 890 1110Z" fill="url(#rows-a)"/>
    <path d="M1110 410 1790 478 2000 1080 1422 1095Z" fill="#3f694e"/>
    <path d="M1110 410 1790 478 2000 1080 1422 1095Z" fill="url(#rows-b)"/>
    <path d="M-20 604C342 518 620 556 930 668c277 100 592 136 1014 80" fill="none" stroke="#eef2d7" stroke-opacity=".58" stroke-width="18"/>
    <path d="M-20 604C342 518 620 556 930 668c277 100 592 136 1014 80" fill="none" stroke="#38523c" stroke-opacity=".44" stroke-width="7"/>
  </g>

  <g id="infrared-field-layer" clip-path="url(#infrared-reveal-mask)">
    <rect width="1920" height="1080" fill="#4c0e3f"/>
    <path d="M-70 70 555-80 750 315 82 480Z" fill="#e12867"/>
    <path d="M555-80 1265-30 1110 410 750 315Z" fill="#7f164f"/>
    <path d="M1265-30 2000 115 1790 478 1110 410Z" fill="#f04d61"/>
    <path d="M82 480 750 315 890 1110-80 1110Z" fill="#b81c5b"/>
    <path d="M750 315 1110 410 1422 1095 890 1110Z" fill="#ff765e"/>
    <path d="M1110 410 1790 478 2000 1080 1422 1095Z" fill="#951450"/>
    <path d="M1110 410 1790 478 2000 1080 1422 1095Z" fill="url(#ir-rows)"/>
    <path d="M-20 604C342 518 620 556 930 668c277 100 592 136 1014 80" fill="none" stroke="#49b6c6" stroke-opacity=".62" stroke-width="18"/>
  </g>

  <rect width="1920" height="1080" fill="url(#shade)"/>
  <path d="M1105 0V1080" stroke="#ffffff" stroke-opacity=".65" stroke-width="2"/>

  <g id="copy-line-1" font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="422" fill="#d7e8dd" font-size="22" font-weight="700" letter-spacing="4">THE HUMAN LIMIT</text>
    <text x="112" y="535" fill="#ffffff" font-size="78" font-weight="700" letter-spacing="-2">FARMERS CAN</text>
    <text x="112" y="624" fill="#ffffff" font-size="78" font-weight="700" letter-spacing="-2">WALK A FIELD.</text>
  </g>
  <g id="copy-line-2" font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="744" fill="#9fe06b" font-size="78" font-weight="700" letter-spacing="-2">BUT THEY CANNOT</text>
    <text x="112" y="833" fill="#9fe06b" font-size="78" font-weight="700" letter-spacing="-2">SEE INFRARED.</text>
  </g>
  <g id="spectrum-key" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
    <text x="1000" y="1020" text-anchor="end" fill="#ffffff" fill-opacity=".72">VISIBLE</text>
    <text x="1165" y="1020" fill="#ffc8d8">INFRARED</text>
  </g>
</svg>
