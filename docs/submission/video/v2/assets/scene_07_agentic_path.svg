<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scene 7 — the agentic path</title>
  <desc id="desc">Two coordinated paths show Gemini reasoning through ADK and MCP, and the private Google Cloud satellite workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfa"/><stop offset="1" stop-color="#eef4ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#123729" flood-opacity=".08"/></filter>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f7d58"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4285f4"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="105" y="105" fill="#23764f" font-size="20" font-weight="700" letter-spacing="3">THE AGENTIC PATH</text>
    <text x="105" y="184" fill="#0b3d2f" font-size="58" font-weight="700" letter-spacing="-1.5">Reasoning, tools and measurement—each in its lane.</text>
    <rect x="1450" y="83" width="365" height="54" rx="27" fill="#e7f3e9" stroke="#b9d4c1" stroke-width="2"/>
    <text x="1632" y="118" text-anchor="middle" fill="#176b49" font-size="16" font-weight="700" letter-spacing="1.6">CATEGORY · COLLABORATIVE PARTNER</text>
  </g>

  <g id="reasoning-path" font-family="Arial, Helvetica, sans-serif">
    <text x="105" y="315" fill="#647b70" font-size="18" font-weight="700" letter-spacing="2.5">REASONING &amp; ACTION</text>
    <path d="M340 468H490M800 468H932M1192 468H1325M1545 468H1655" fill="none" stroke="#2f7d58" stroke-width="4" marker-end="url(#green-arrow)"/>
    <g id="node-farmer" transform="translate(105 370)" filter="url(#shadow)">
      <rect width="235" height="196" rx="28" fill="#fff" stroke="#d8e4dc" stroke-width="2"/>
      <circle cx="117" cy="74" r="35" fill="#e8f2ea"/>
      <circle cx="117" cy="65" r="13" fill="#23764f"/><path d="M88 112c6-25 20-36 29-36s23 11 29 36" fill="#23764f"/>
      <text x="117" y="158" text-anchor="middle" fill="#0b3d2f" font-size="23" font-weight="700">Farmer</text>
    </g>
    <g id="node-gemini" transform="translate(490 350)" filter="url(#shadow)">
      <rect width="310" height="236" rx="28" fill="#fff" stroke="#a8c4b2" stroke-width="3"/>
      <text x="155" y="66" text-anchor="middle" fill="#0b3d2f" font-size="28" font-weight="700">Gemini 3.5 Flash</text>
      <text x="155" y="104" text-anchor="middle" fill="#456459" font-size="18">Vertex AI</text>
      <line x1="46" y1="133" x2="264" y2="133" stroke="#d9e4dd" stroke-width="2"/>
      <text x="155" y="177" text-anchor="middle" fill="#23764f" font-size="17" font-weight="700" letter-spacing="1.4">REASONING</text>
      <text x="155" y="207" text-anchor="middle" fill="#60766b" font-size="15">plans the workflow</text>
    </g>
    <g id="node-adk" transform="translate(932 370)" filter="url(#shadow)">
      <rect width="260" height="196" rx="28" fill="#fff" stroke="#d8e4dc" stroke-width="2"/>
      <text x="130" y="72" text-anchor="middle" fill="#0b3d2f" font-size="27" font-weight="700">Google ADK</text>
      <text x="130" y="109" text-anchor="middle" fill="#456459" font-size="17">specialist agents</text>
      <rect x="55" y="138" width="150" height="32" rx="16" fill="#e9f3eb"/>
      <text x="130" y="160" text-anchor="middle" fill="#23764f" font-size="13" font-weight="700">ORCHESTRATION</text>
    </g>
    <g id="node-mcp" transform="translate(1325 370)" filter="url(#shadow)">
      <rect width="220" height="196" rx="28" fill="#fff" stroke="#d8e4dc" stroke-width="2"/>
      <text x="110" y="76" text-anchor="middle" fill="#0b3d2f" font-size="31" font-weight="700">MCP</text>
      <text x="110" y="111" text-anchor="middle" fill="#456459" font-size="17">typed tools</text>
      <rect x="43" y="138" width="134" height="32" rx="16" fill="#e9f3eb"/>
      <text x="110" y="160" text-anchor="middle" fill="#23764f" font-size="13" font-weight="700">EVIDENCE + ACTION</text>
    </g>
    <g id="node-deterministic" transform="translate(1655 370)" filter="url(#shadow)">
      <rect width="160" height="196" rx="28" fill="#0b3d2f"/>
      <text x="80" y="66" text-anchor="middle" fill="#a9e36d" font-size="19" font-weight="700">GEOMETRY</text>
      <text x="80" y="99" text-anchor="middle" fill="#fff" font-size="15">+</text>
      <text x="80" y="132" text-anchor="middle" fill="#a9e36d" font-size="19" font-weight="700">PIXEL MATH</text>
      <text x="80" y="164" text-anchor="middle" fill="#d5e9dc" font-size="13">deterministic</text>
    </g>
  </g>

  <g id="data-path" font-family="Arial, Helvetica, sans-serif">
    <text x="105" y="700" fill="#647b70" font-size="18" font-weight="700" letter-spacing="2.5">PRIVATE SATELLITE WORKFLOW · GOOGLE CLOUD</text>
    <path d="M335 838H470M700 838H832M1087 838H1218M1455 838H1585" fill="none" stroke="#4285f4" stroke-width="4" marker-end="url(#blue-arrow)"/>
    <g transform="translate(105 755)" filter="url(#shadow)"><rect width="230" height="166" rx="26" fill="#fff" stroke="#cddcf2" stroke-width="2"/><text x="115" y="74" text-anchor="middle" fill="#1c4f8f" font-size="25" font-weight="700">Cloud Tasks</text><text x="115" y="112" text-anchor="middle" fill="#617389" font-size="16">authenticated job</text></g>
    <g transform="translate(470 755)" filter="url(#shadow)"><rect width="230" height="166" rx="26" fill="#fff" stroke="#cddcf2" stroke-width="2"/><text x="115" y="67" text-anchor="middle" fill="#1c4f8f" font-size="25" font-weight="700">Private worker</text><text x="115" y="103" text-anchor="middle" fill="#617389" font-size="16">Cloud Run</text><rect x="63" y="124" width="104" height="26" rx="13" fill="#e8f0fe"/><text x="115" y="142" text-anchor="middle" fill="#4285f4" font-size="12" font-weight="700">NO PUBLIC INGRESS</text></g>
    <g transform="translate(832 755)" filter="url(#shadow)"><rect width="255" height="166" rx="26" fill="#fff" stroke="#cddcf2" stroke-width="2"/><text x="127" y="67" text-anchor="middle" fill="#1c4f8f" font-size="25" font-weight="700">Sentinel-2 L2A</text><text x="127" y="103" text-anchor="middle" fill="#617389" font-size="16">real observations</text><text x="127" y="137" text-anchor="middle" fill="#516880" font-size="13">B04 · B05 · B08 · B11 · SCL</text></g>
    <g transform="translate(1218 755)" filter="url(#shadow)"><rect width="237" height="166" rx="26" fill="#fff" stroke="#cddcf2" stroke-width="2"/><text x="118" y="67" text-anchor="middle" fill="#1c4f8f" font-size="25" font-weight="700">Firestore</text><text x="118" y="103" text-anchor="middle" fill="#617389" font-size="16">state + evidence</text><text x="118" y="137" text-anchor="middle" fill="#516880" font-size="13">persistent provenance</text></g>
    <g transform="translate(1585 755)" filter="url(#shadow)"><rect width="230" height="166" rx="26" fill="#fff" stroke="#cddcf2" stroke-width="2"/><text x="115" y="67" text-anchor="middle" fill="#1c4f8f" font-size="23" font-weight="700">Cloud Storage</text><text x="115" y="103" text-anchor="middle" fill="#617389" font-size="16">artifacts</text><text x="115" y="137" text-anchor="middle" fill="#516880" font-size="13">immutable references</text></g>
  </g>
  <g id="stack-footer" font-family="Arial, Helvetica, sans-serif">
    <text x="105" y="1018" fill="#557066" font-size="18" font-weight="700" letter-spacing="2">GEMINI 3.5 FLASH · VERTEX AI · GOOGLE ADK · MCP · GOOGLE CLOUD</text>
  </g>
</svg>
