<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scene 6 — 1415 Agri product reveal</title>
  <desc id="desc">The canonical 1415 Agri logo and the satellite intelligence positioning line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfdfa"/><stop offset="1" stop-color="#eef5ef"/></linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0v96" fill="none" stroke="#0b3d2f" stroke-opacity=".035" stroke-width="2"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1565" cy="190" r="410" fill="#dfeee2" opacity=".52"/>
  <circle cx="295" cy="975" r="470" fill="#edf5ec" opacity=".78"/>
  <g id="canonical-logo">
    <image x="659" y="115" width="602" height="572" preserveAspectRatio="xMidYMid meet" xlink:href="../../../../../core/static/core/brand/1415-agri-logo.png"/>
  </g>
  <g id="product-positioning" font-family="Arial, Helvetica, sans-serif">
    <line x1="710" y1="736" x2="1210" y2="736" stroke="#b9d1c0" stroke-width="2"/>
    <text x="960" y="824" text-anchor="middle" fill="#0b3d2f" font-size="38" font-weight="700" letter-spacing="4">SATELLITE INTELLIGENCE</text>
    <text x="960" y="877" text-anchor="middle" fill="#23764f" font-size="38" font-weight="700" letter-spacing="4">FOR EVERY FIELD</text>
  </g>
  <g id="proof-transition" font-family="Arial, Helvetica, sans-serif">
    <rect x="790" y="954" width="340" height="54" rx="27" fill="#0b3d2f"/>
    <text x="960" y="990" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" letter-spacing="2.2">NOW, THE PROOF.</text>
  </g>
</svg>
